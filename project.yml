name: ClipboardKeyboard
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "16.0"
targets:
  ClipboardKeyboard:
    type: application
    platform: iOS
    sources: [ClipboardKeyboard]
    settings:
      base:
        INFOPLIST_FILE: ""
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.clipboardkb
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    dependencies:
      - target: ClipboardKB
        embed: true
  ClipboardKB:
    type: app-extension
    platform: iOS
    sources: [KeyboardExtension]
    settings:
      base:
        INFOPLIST_FILE: KeyboardExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.clipboardkb.keyboard
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
