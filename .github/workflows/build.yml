name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project ClipboardKeyboard.xcodeproj \
            -scheme ClipboardKeyboard \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/ClipboardKeyboard.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -R $RUNNER_TEMP/ClipboardKeyboard.xcarchive/Products/Applications/ClipboardKeyboard.app \
                $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r ClipboardKeyboard-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ${{ runner.temp }}/ClipboardKeyboard-unsigned.ipa
